[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BookerPdfTool"
version = "2023.7.22.0"
description = "iBooker/DracoUnion PDF 工具"
readme = "README.md"
license = {text = "SATA"}
requires-python = ">=3.6"
authors = [
    {name = "wizardforcel", email = "wizard.z@qq.com"},
]
keywords = [
    "wiki",
    "知识库",
    "document",
    "文档",
    "crawler",
    "爬虫",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Localization",
    "Topic :: Utilities",
]
dependencies = [
    "requests",
    "pyquery",
    "imgyaso",
    "PyMuPdf",
    "img2pdf",
    "rarfile",
    "numpy",
    "pillow",
    "opencv-python",
    "pyjbig2enc",
]

[project.urls]
Homepage = "https://github.com/DracoUnion/BookerPdfTool"

[project.scripts]
BookerPdfTool = "BookerPdfTool.__main__:main"
pdf-tool = "BookerPdfTool.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["BookerPdfTool*"]

[tool.setuptools.package-data]
"*" = ["*"]
